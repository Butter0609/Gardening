<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: #f4efe6;
      color: #1d2a24;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      transition: background-color 300ms ease;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
      margin: 0 0 32px;
    }

    button {
      background: #1d2a24;
      border: 0;
      border-radius: 4px;
      color: #fffaf1;
      cursor: pointer;
      font: 600 1rem/1.2 Arial, sans-serif;
      padding: 14px 22px;
      transition: background-color 180ms ease, transform 180ms ease;
    }

    button:hover {
      background: #33473d;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #1d2a24;
      outline-offset: 4px;
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <button id="colorButton" type="button">Change background</button>
  </main>

  <script>
    const colorButton = document.querySelector('#colorButton');

    colorButton.addEventListener('click', () => {
      const randomColor = `hsl(${Math.floor(Math.random() * 360)}, 60%, 88%)`;
      document.body.style.backgroundColor = randomColor;
    });
  </script>
</body>
</html>
